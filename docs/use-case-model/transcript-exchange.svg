  <text x="405" y="502" text-anchor="middle" font-size="12" fill="#5F5E5A">registrar notifies · ends in failure</text>
  <rect x="260" y="540" width="260" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.75"/>
  <text x="390" y="562" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">3 · Sending SIS delivers</text>
  <text x="390" y="582" text-anchor="middle" font-size="12" fill="#5F5E5A">PESC XML or signed PDF</text>
  <rect x="260" y="620" width="260" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.75"/>
  <text x="390" y="642" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">4 · Receiving SIS loads</text>
  <text x="390" y="662" text-anchor="middle" font-size="12" fill="#5F5E5A">match student, post credit</text>
  <rect x="290" y="700" width="230" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
