<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1016" viewBox="0 0 1100 1016" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Use case: Send a transcript to another institution</title>
<desc>The full transcript-exchange use case: its topic, value driver, primary actor and review history; the actors who carry out each step; the main success scenario with extensions 2a and 4a; the invoked subfunction use case; and the CEDS elements (plus one PESC element flagged as a CEDS gap) that each step reads or writes. Stakeholders are actors linked to the use case with their interest.</desc>
<defs>
  <marker id="m-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="m-read" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="m-write" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="m-review" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
