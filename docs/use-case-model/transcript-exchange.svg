  <rect x="20" y="130" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
  <text x="130" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Student mobility</text>
  <text x="130" y="172" text-anchor="middle" font-size="12" fill="#5F5E5A">value driver (ALIGNS_WITH)</text>
  <line x1="300" y1="58" x2="244" y2="58" stroke="#5F5E5A" stroke-width="1" marker-end="url(#m-dark)"/>
  <line x1="300" y1="158" x2="244" y2="158" stroke="#5F5E5A" stroke-width="1" marker-end="url(#m-dark)"/>
</g>

<!-- the use case -->
<g>
  <rect x="300" y="20" width="480" height="200" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="540" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#26215C">Send a transcript to another institution</text>
  <text x="540" y="62" text-anchor="middle" font-size="12" fill="#534AB7">use case uc:transcript-exchange · version 1</text>
  <g font-size="12" fill="#3C3489">
    <text x="318" y="88"><tspan font-weight="600">Scope:</tspan> sending institution student information system</text>
    <text x="318" y="106"><tspan font-weight="600">Goal level:</tspan> user goal · <tspan font-weight="600">Maturity:</tspan> L3 · <tspan font-weight="600">Vetted:</tspan> yes · <tspan font-weight="600">Priority:</tspan> high</text>
    <text x="318" y="124"><tspan font-weight="600">Frequency:</tspan> about 300 per week, peaking at term end</text>
    <text x="318" y="142"><tspan font-weight="600">Precondition:</tspan> the student has completed at least one term</text>
    <text x="318" y="160"><tspan font-weight="600">Trigger:</tspan> the student requests a transcript be sent</text>
    <text x="318" y="178"><tspan font-weight="600">Success:</tspan> receiving institution has a complete, verifiable record</text>
    <text x="318" y="196"><tspan font-weight="600">Failure:</tspan> no record has left the institution; the student knows why</text>
  </g>
</g>

