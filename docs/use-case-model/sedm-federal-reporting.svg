<text x="36" y="1120" font-size="12" fill="#2C2C2A" text-anchor="start">· Scope, priority, frequency, precondition, trigger and the success and failure guarantees are not yet written in the workbook.</text>
<text x="36" y="1138" font-size="12" fill="#2C2C2A" text-anchor="start">· Each EDFacts file is its own user goal; should each become a user-goal use case invoked from this summary use case?</text>
<text x="36" y="1156" font-size="12" fill="#2C2C2A" text-anchor="start">· Only FS002 lists its data (19 elements); the CEDS links on FS002 are proposed and need review, and the other 82 files have none yet.</text>
<text x="36" y="1174" font-size="12" fill="#2C2C2A" text-anchor="start">· Several files (Title I, Title III, assessment, directory) are not IDEA files; should they sit under a broader EDFacts reporting value driver?</text>
